name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Check the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::Cannot read the workspace version from Cargo.toml."
            exit 1
          fi
          if [ "$PUBLISH" = true ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml."
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fiend-panel/web/package-lock.json
      - name: Build the panel web app
        working-directory: fiend-panel/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install the Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev
      - name: Test
        run: |
          cargo test --locked --workspace --exclude fiend-desktop --no-fail-fast
          cargo test --locked -p fiend-desktop --lib --bins --no-fail-fast

  android:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Install the Rust tools
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install --locked cargo-ndk --version 4.1.2
      - name: Prepare the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            if [ "$PUBLISH" = true ]; then
              echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not set."
              exit 1
            fi
            echo "::warning::The signing key is not set. The APK is not signed."
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "FIEND_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        working-directory: fiend-android
        env:
          FIEND_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FIEND_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FIEND_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon lintRelease testReleaseUnitTest assembleRelease
      - name: Package
        run: |
          mkdir dist
          apk=fiend-android/app/build/outputs/apk/release
          if [ -n "${FIEND_ANDROID_KEYSTORE:-}" ]; then
            apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)
            "$apksigner" verify --verbose "$apk/app-release.apk"
            expected=$(openssl x509 -in fiend-android/release-cert.pem -outform DER | sha256sum | cut -d ' ' -f 1)
            actual=$("$apksigner" verify --print-certs "$apk/app-release.apk" | sed -n 's/.*certificate SHA-256 digest: //p' | sort -u)
            if [ "$actual" != "$expected" ]; then
              echo "::error::The APK certificate $actual is not the certificate in fiend-android/release-cert.pem ($expected)."
              exit 1
            fi
            cp "$apk/app-release.apk" "dist/fiend-$VERSION-android.apk"
          else
            cp "$apk/app-release-unsigned.apk" "dist/fiend-$VERSION-android-unsigned.apk"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  linux:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install the Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb@3.8.0,cargo-generate-rpm@0.21.1
      - name: Build
        run: cargo build --release --locked -p fiend-desktop -p fiend-daemon -p fiend-cli
      - name: Package
        run: |
          mkdir dist
          cargo deb --no-build -p fiend-desktop --output dist/
          cargo generate-rpm -p fiend-desktop -o dist/
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build
        env:
          FIEND_TARGETS: aarch64-apple-darwin x86_64-apple-darwin
        run: sh tools/package/macos-bundle.sh
      - name: Package
        run: |
          mkdir dist
          lipo -info target/bundle/Fiend.app/Contents/MacOS/fiend-desktop
          cp target/bundle/Fiend.dmg "dist/fiend-$VERSION-macos-universal.dmg"
          tar -C target/bundle -czf "dist/fiend-$VERSION-macos-universal.tar.gz" Fiend.app
          cp tools/package/install-macos.sh dist/install-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  windows:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: amd64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Build and package
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  docker:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, android, linux, macos, windows, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Make the checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -- --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          if [ "$PRERELEASE" = true ]; then set -- "$@" --prerelease; fi
          gh release create "$GITHUB_REF_NAME" "$@" dist/*
