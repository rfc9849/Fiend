[package]
name = "fiend-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "fiend_desktop"
path = "src/lib.rs"

[[bin]]
name = "fiend-desktop"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "=0.8.1", default-features = false }
fiend-ipc = { path = "../fiend-ipc" }
fiend-app = { path = "../fiend-app" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
dirs = "7.0.0"
qrcode = "0.14.1"
rfd = "0.17.2"
auto-launch = "0.6.0"
rqrr = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
fiend-daemon = { path = "../fiend-daemon" }
fiend-core = { path = "../fiend-core" }
tokio-util = "0.7"
gpui-kit = { version = "=0.8.1", default-features = false, features = ["test-support"] }

[[test]]
name = "screens"
path = "tests/screens.rs"
harness = false

[[test]]
name = "e2e"
path = "tests/e2e.rs"
harness = false

[package.metadata.deb]
name = "fiend"
section = "net"
priority = "optional"
depends = "$auto, systemd"
extended-description = "Fiend VPN desktop client, daemon, and command line tool."
maintainer-scripts = "../packaging/linux"
assets = [
    ["../target/release/fiend-desktop", "usr/bin/", "755"],
    ["../target/release/fiend-daemon", "usr/bin/", "755"],
    ["../target/release/fiend", "usr/bin/", "755"],
    ["../packaging/linux/fiend.desktop", "usr/share/applications/", "644"],
    ["../packaging/linux/fiend.service", "usr/lib/systemd/system/", "644"],
    ["../packaging/linux/fiend.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../packaging/linux/fiend.png", "usr/share/icons/hicolor/1024x1024/apps/", "644"],
]

[package.metadata.generate-rpm]
name = "fiend"
assets = [
    { source = "../target/release/fiend-desktop", dest = "/usr/bin/fiend-desktop", mode = "755" },
    { source = "../target/release/fiend-daemon", dest = "/usr/bin/fiend-daemon", mode = "755" },
    { source = "../target/release/fiend", dest = "/usr/bin/fiend", mode = "755" },
    { source = "../packaging/linux/fiend.desktop", dest = "/usr/share/applications/fiend.desktop", mode = "644" },
    { source = "../packaging/linux/fiend.service", dest = "/usr/lib/systemd/system/fiend.service", mode = "644" },
    { source = "../packaging/linux/fiend.svg", dest = "/usr/share/icons/hicolor/scalable/apps/fiend.svg", mode = "644" },
]
post_install_script = "../packaging/linux/postinst"
pre_uninstall_script = "../packaging/linux/prerm"
