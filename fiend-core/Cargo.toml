[package]
name = "fiend-core"
version.workspace = true
license.workspace = true
edition = "2024"

[dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bytes = "1"
fiend-rules = { path = "../fiend-rules" }
flate2 = "1.1.10"
h2 = "0.4"
hex = "0.4"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
http = "1"
ppp = "2.3"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dependencies.hmac]
version = "0.13"

[dependencies.aes-gcm]
version = "0.11"
features = ["zeroize"]

[dependencies.hkdf]
version = "0.13"

[dependencies.tokio]
version = "1"
features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"]

[dependencies.ml-kem]
version = "0.3"
features = ["getrandom", "zeroize"]

[dependencies.p256]
version = "0.14"
features = ["ecdh"]

[dependencies.rand]
version = "0.10"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.sha2]
version = "0.11"

[dependencies.socket2]
version = "0.6"
features = ["all"]

[dependencies.x25519-dalek]
version = "3"

[dependencies.zeroize]
version = "1"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
sysinfo = { version = "=0.40.1", default-features = false, features = ["system", "network"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
ureq = { version = "=3.5.0", features = ["socks-proxy"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
