[package]
name = "fiend-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "fiend"
path = "src/main.rs"

[dependencies]
fiend-ipc = { path = "../fiend-ipc" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "rt", "signal", "time"] }
