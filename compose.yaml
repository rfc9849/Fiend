name: fiend

x-fiend: &fiend
  image: ghcr.io/rfc9849/fiend:${FIEND_VERSION:-latest}
  build: .
  network_mode: host
  restart: unless-stopped
  stop_grace_period: 15s
  volumes:
    - etc:/etc/fiend
    - data:/var/lib/fiend
    - run:/run/fiend

services:
  node:
    <<: *fiend
    command: node
    environment:
      FIEND_NODE_PORT: ${FIEND_NODE_PORT:-443}
      FIEND_NODE_LISTEN: ${FIEND_NODE_LISTEN:-}
      FIEND_NODE_PROXY_PROTOCOL: ${FIEND_NODE_PROXY_PROTOCOL:-false}
      FIEND_NODE_FALLBACK: ${FIEND_NODE_FALLBACK:-}
      FIEND_NODE_FALLBACK_PROXY_PROTOCOL: ${FIEND_NODE_FALLBACK_PROXY_PROTOCOL:-false}
  panel:
    <<: *fiend
    command: panel
    environment:
      FIEND_PANEL_LISTEN: ${FIEND_PANEL_LISTEN:-}
    depends_on:
      - node

volumes:
  etc:
  data:
  run:
