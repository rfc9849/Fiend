[package]
name = "fiend-daemon"
version = "0.1.0"
edition = "2024"

[lib]
name = "fiend_daemon"
path = "src/lib.rs"

[[bin]]
name = "fiend-daemon"
path = "src/main.rs"

[dependencies]
fiend-core = { path = "../fiend-core" }
fiend-tun = { path = "../fiend-tun" }
fiend-app = { path = "../fiend-app", features = ["subscription"] }
fiend-ipc = { path = "../fiend-ipc" }
clap = { version = "4", features = ["derive"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "fmt"] }

[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "0.6", features = ["all"] }
tun-rs = { version = "=2.8.15", features = ["async_tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
route_manager = "=0.2.17"
socket2 = { version = "0.6", features = ["all"] }
system-configuration = "0.8"
tun-rs = { version = "=2.8.15", features = ["async_tokio"] }

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
socket2 = { version = "0.6", features = ["all"] }
tun-rs = { version = "=2.8.15", features = ["async_tokio"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
