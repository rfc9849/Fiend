[package]
name = "fiend-ipc"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time", "macros"] }
