[workspace]
members = ["fiend-core", "fiend-tun", "fiend-app", "fiend-ipc", "fiend-daemon", "fiend-cli", "fiend-desktop", "fiend-mobile"]
resolver = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[profile.release.package.gpui-pre-windows]
debug-assertions = true

[profile.release.build-override]
debug-assertions = true
