[workspace]
members = ["fiend-core", "fiend-tun", "fiend-rules", "fiend-app", "fiend-ipc", "fiend-daemon", "fiend-cli", "fiend-desktop", "fiend-mobile", "fiend-panel"]
resolver = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[profile.xwin]
inherits = "release"

[profile.xwin.package.gpui-pre-windows]
debug-assertions = true

[profile.xwin.build-override]
debug-assertions = true
