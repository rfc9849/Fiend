[package]
name = "fiend-app"
version = "0.1.0"
edition = "2024"

[features]
subscription = ["dep:ureq"]

[dependencies]
fiend-core = { path = "../fiend-core" }
fiend-tun = { path = "../fiend-tun" }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
flate2 = "1.1.10"
hex = "0.4"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
ureq = { version = "=3.5.0", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
