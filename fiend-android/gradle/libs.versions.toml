ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

fiend-android-application = { id = "fiend.android.application" }
fiend-android-library = { id = "fiend.android.library" }
fiend-android-compose = { id = "fiend.android.compose" }
fiend-android-feature = { id = "fiend.android.feature" }
fiend-hilt = { id = "fiend.hilt" }
fiend-jvm-library = { id = "fiend.jvm.library" }
